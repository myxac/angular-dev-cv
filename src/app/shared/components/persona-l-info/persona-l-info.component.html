@if (model) {
<div class="personal-info">
  <div class="personal-info__photo">
    <div class="background-image"></div>
  </div>
  <div class="personal-info__title title">
    <div class="main-text">{{ model.title }}</div>
    <hr />
  </div>
  <div class="contact-info">
    @for (item of ($any(model).personalData | keyvalue); track item) { @if
    (item.value) {
    <p class="item">
      <i [class]="getItemClass(item.key)"></i>{{ item.value }}
    </p>
    } }
  </div>
</div>
}
