@if (model) {
<div class="personal-info">
  <div class="personal-info__photo">
    <div class="background-image"></div>
  </div>
  <app-title title="{{model.title}}"></app-title>
  <div class="contact-info">
    @for (item of ($any(model).personalData | keyvalue); track item) { @if
    (item.value) {
    <p class="item"><i [class]="getItemClass(item.key)"></i>{{ item.value }}</p>
    } }
  </div>
</div>
}
