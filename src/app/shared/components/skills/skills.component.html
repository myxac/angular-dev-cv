@if (model?.skills) {
<div class="skills">
  <div class="skills__title title">
    <h2 class="title">{{ model?.title }}</h2>
    <hr />
  </div>
  <div class="skills__list">
    @for (item of model?.skills | keyvalue; track item) {
    <div class="skills-item">
      <span>{{ item.value[0] }}</span>
      <span>{{ item.value[1] }}</span>
    </div>
    }
  </div>
</div>
}
