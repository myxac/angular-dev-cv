@if (model?.skills) {
<div class="skills">
<app-title title="{{model?.title}}"></app-title>
  <div class="skills__list">
    @for (item of model?.skills | keyvalue; track item.key) {
    <div class="skills-item">
      <span>{{ item.value[0] }}</span>
      <span>{{ item.value[1] }}</span>
    </div>
    }
  </div>
</div>
}
